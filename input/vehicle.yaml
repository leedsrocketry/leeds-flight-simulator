geometry:
  diameter: 0.130   # reference diameter (m)
  length: 2.6       # total length (m)
  # reference_area is derived: π·d²/4

mass:
  wet: 26.5              # mass at launch — airframe + loaded motor (kg)
  dry: 14.7              # mass after burnout — airframe + empty casing (kg)
  cg_dry: 1.15           # dry vehicle CG from nosecone tip (m)
  motor_cg_loaded: 1.82  # loaded motor CG from nosecone tip (m)
                         # Used in dynamics.py:
                         #   CG(t) = (m_dry·cg_dry + m_prop(t)·motor_cg_loaded)
                         #           / (m_dry + m_prop(t))

inertia:
  I_R_wet: 0.012  # roll axis, wet (kg·m²)
  I_R_dry: 0.008  # roll axis, dry (kg·m²)
  I_L_wet: 5.2    # lateral axis, wet (kg·m²)
  I_L_dry: 3.1    # lateral axis, dry (kg·m²)

nozzle:
  exit: 2.55  # nozzle exit plane from nosecone tip (m)

recovery:
  CdA_drogue: 0.15          # drogue drag area (m²)
  CdA_main: 2.8             # main parachute drag area (m²)
  deploy_altitude_agl: 305  # main deploy altitude above launch site (m)

roll:
  r_fin: 0.095  # fin CP spanwise distance from centreline (m)
