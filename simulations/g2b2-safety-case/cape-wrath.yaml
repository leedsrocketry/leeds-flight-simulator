vehicle: "g2b2.yaml"  # path to vehicle.yaml (relative to this file);
                      # motor and aero_tables paths are specified inside vehicle.yaml

site:
  latitude: 58.6104700    # degrees — WGS-84 latitude of launch site
  longitude: -4.9434804   # degrees — WGS-84 longitude of launch site

  ballistic_exclusion_radius: 500   # metres — minimum acceptable ballistic landing distance
                                    # from the launch site; used during inclination optimisation;
                                    # has no effect when inclination is not "auto"

  launch_monitour_radius: 5000      # metres — radius of the automatic monitour station
                                    # placed at the launch site; added to every monitour check
                                    # in addition to any stations listed below

  altitude_ceiling: 16764           # metres — danger area ceiling;

  danger_area: "d802.geojson"         # GeoJSON polygon defining the danger area footprint;
                                      # coordinates must be [longitude, latitude] per the GeoJSON spec

  coastline: "coastline.geojson"    # optional — GeoJSON polygon of the on-land area;
                                    # omit this key entirely to disable the coastline check
  coastline_mode: "sea"             # required if coastline provided. Direction of the coastline compliance check:
                                    #   "sea"            — landing must be outside the polygon
                                    #                      (at sea)
                                    #   "land"           — landing must be inside the polygon
                                    #                      (on land)

  monitour_stations:                # additional fixed monitour stations;
                                    # the launch site is added automatically (see launch_monitour_radius)
    - name: "MOD Range Control"
      latitude: 58.60215            # degrees
      longitude: -4.77592           # degrees
      radius: 10000                 # metres

  map_markers:                      # optional — additional points of interest overlaid on the
    - name: "Durness"               # dispersion map; no compliance check attached
      latitude: 58.56874
      longitude: -4.74763

launch:
  rail:
    azimuth: 0               # degrees clockwise from North (0–360), or "auto" to optimise
    azimuth_range: [-90, 90]      # [min, max] integer search range for azimuth optimisation;
                                  # required when azimuth is "auto"; ignored otherwise
    inclination: 80           # degrees from horizontal (0 = horizontal, 90 = vertical),
                                  # or "auto" to optimise
    inclination_range: [85, 90]   # [min, max] integer search range for inclination optimisation;
                                  # required when inclination is "auto"; ignored otherwise
    length: 4.0                   # metres — distance the CG travels along the rail before free flight

  wind_profiles: "wind_profiles.npz"  # path to wind profile ensemble (.npz or a directory of .npz);
                                      # must contain arrays: altitude_m (M,), wind_east_ms (N,M),
                                      # wind_north_ms (N,M); N must be >= samples below

  surface_wind:                   # optional — override the lower portion of every wind profile
                                  # with a measured surface reading; omit this section to disable
    speed_ms: 5.0                 # m/s — surface wind speed
    bearing_deg: 0.0              # degrees clockwise from North — direction the wind is blowing FROM
    blend_height_m: 300           # metres AGL — surface wind blends linearly into profile wind
                                  # between 0 and this altitude; above this altitude, profile is unchanged

monte_carlo:
  samples: 1000                   # integer ≥ 1 — number of samples per descent scenario;
                                  # wind profile ensemble must have at least this many profiles
  seed: 42                        # integer — master random seed; any value gives a reproducible run

  uncertainties:
    azimuth_sigma: 1.0            # degrees — 1σ launch rail azimuth uncertainty (Normal)
    inclination_sigma: 0.5        # degrees — 1σ launch rail inclination uncertainty (Normal)
    fin_cant_sigma: 0.02          # degrees — 1σ fin cant angle uncertainty (Normal)
    impulse_factor_sigma: 0.067   # fractional — 1σ total-impulse scale factor uncertainty (Normal);
                                  # e.g. 0.067 represents ±6.7% at 1σ

  acceptance:
    compliance_threshold: 0.997   # fraction in [0, 1] — minimum fraction of samples that must be
                                  # compliant for a scenario to pass; 0.997 = 99.7%
    buffer_distance: 1000         # metres — inward buffer applied to the danger area polygon and ceiling before
                                  # containment checking; full trajectory must be inside the buffered volume

    sm_transition_mach: 0.91      # Mach — threshold separating subsonic and supersonic SM checks;
                                  # the definition of this boundary varies between tools; the value
                                  # used here follows the RASAero II convention
    sm_subsonic_min: 1.0          # calibres — minimum acceptable static margin when M < sm_transition_mach
    sm_supersonic_min: 2.0        # calibres — minimum acceptable static margin when M >= sm_transition_mach
    aoa_max: 12.0                 # degrees — maximum acceptable angle of attack at any point in flight
    sm_aoa_threshold: 5.0         # degrees — SM check is only applied when AoA < this value;
                                  # naturally excludes rail-exit and apogee transients

    # Scenarios to apply the coastline check to (requires coastline above to be set).
    # Scenarios not active for the current vehicle configuration are skipped with a warning.
    sea_check_scenarios:
      - nominal
      - ballistic
      - drogue_only
      - premature_main

    # Scenarios to check for monitour station coverage.
    # Scenarios not active for the current vehicle configuration are skipped with a warning.
    monitour_check_scenarios:
      - ballistic
      - drogue_only

verification:     # optional — single-trajectory comparison against a
                  # reference CSV from any other flight simulator;
                  # omit this section to skip the verification check
  reference_trajectory: "rasaero_nominal_simulation.csv" # path to reference CSV
  # azimuth: 0              # degrees — override launch.rail.azimuth for verification;
  #                         # omit to use launch.rail value (or 0 if "auto")
  # inclination: 80         # degrees — override launch.rail.inclination for verification;
  #                         # omit to use launch.rail value (or 0 if "auto")
  altitude_tolerance: 0.05  # fraction in [0, 1] — tolerance band on altitude
  mach_tolerance: 0.05      # fraction in [0, 1] — tolerance band on Mach number
  sm_tolerance: 0.05        # fraction in [0, 1] — tolerance band on static margin
  mass_tolerance: 0.05      # fraction in [0, 1] — tolerance band on vehicle mass
  exceedance_fraction: 0.01 # fraction in [0, 1] — fraction of comparison points allowed
                            # outside the tolerance band before a quantity fails;
                            # 0.01 = 1%; set to 0 for strict (every-point) checking