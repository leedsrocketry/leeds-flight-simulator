motor: "o3400.eng"             # RASP .eng thrust curve file (path relative to this file)
aero_tables: "aero_tables/"    # path to a single RASAero II Aeroplot CSV, or a directory of CSVs;
                               # a single file runs without pitch/yaw damping or roll modelled (with warning)
# fins_aero_table: "aero_tables/fins.csv"  # uncomment to identify the fins component explicitly;
                                           # if omitted, the file whose name contains "fin" is used (case insensitive)

geometry:
  diameter: 0.130        # body diameter (m)
  length: 2.654          # total length (m)
  nozzle_diameter: 0.069 # nozzle exit diameter (m)
  fin_cp_radius: 0.095   # fin CP spanwise distance from centreline (m)
  fin_span: 0.113        # fin semi-span, tip-to-root (m)

mass:
  wet_mass: 24                 # total mass at launch — airframe + loaded motor (kg)
  wet_cg: 1.745                # wet vehicle CG from nosecone tip (m)
  wet_inertia_lateral:  9.217  # wet vehicle lateral inertia about wet CG (kg·m²)
  wet_inertia_roll:     0.047  # wet vehicle roll inertia about roll axis (kg·m²)
  propellant_outer_diameter: 0.086   # propellant grain outer diameter (m); omit to use full motor diameter
  propellant_inner_diameter: 0.030   # propellant bore diameter (m); omit for solid cylinder

recovery:
  # Omit a parachute section entirely to disable that stage.
  # See documentation for which descent scenarios are active for each configuration.
  drogue:
    cd: 0.97
    diameter: 0.914       # reference diameter (m); area = π·d²/4
    threshold: apogee     # "apogee" or altitude in metres AGL
  main:
    cd: 2.2
    diameter: 1.829     # reference diameter (m); area = π·d²/4
    threshold: 305      # metres AGL
