motor: "o3400.eng"                   # RASP .eng thrust curve file (path relative to this file)
aero_tables: "aero-tables/"          # path to a single RASAero II Aeroplot CSV, or a directory of CSVs;
                                     # a single file runs without pitch/yaw damping or roll modelled (with warning)
# fins_aero_table: "aero-tables/fins.csv"  # uncomment to identify the fins component explicitly;
                                           # if omitted, the file whose name contains "fin" is used (case insensitive)

body_diameter_mm: 130.0              # overall body diameter (mm)
nozzle_diameter_mm: 69.0             # nozzle exit diameter (mm)

rasaero:                             # RASAero-specific vehicle properties (pyrasaero reads, LFS ignores)
  surface_finish: "Camouflage Paint"
  color: "Orange"
  motor: "O3400-IM-P  (CTI)"        # RASAero motor name (not the .eng path)

components:                          # ordered forward-to-aft for RASAero construction
  nosecone:
    shape: "Von Karman Ogive"
    length_mm: 1001.8
    tip_radius_mm: 0.0

  body_tube:
    length_mm: 1381.0

  boattail:
    length_mm: 271.0
    aft_diameter_mm: 101.6

  fins:
    count: 4
    span_mm: 113.0                   # fin semi-span, tip-to-root (one side) (mm)
    root_chord_mm: 261.0
    tip_chord_mm: 202.9
    sweep_distance_mm: 77.1
    aft_offset_mm: 3.9
    airfoil_section: "Double Wedge"
    thickness_mm: 6.0
    leading_edge_radius_mm: 0.5

mass:
  wet_mass_kg: 24.0                        # total mass at launch — airframe + loaded motor (kg)
  wet_cg_mm: 1745.0                        # wet vehicle CG from nosecone tip (mm)
  wet_inertia_lateral_kg_m2: 9.217         # wet vehicle lateral inertia about wet CG (kg-m^2)
  wet_inertia_roll_kg_m2: 0.047            # wet vehicle roll inertia about roll axis (kg-m^2)
  propellant_outer_diameter_mm: 86.0       # propellant grain outer diameter (mm); omit to use full motor diameter
  propellant_inner_diameter_mm: 30.0       # propellant bore diameter (mm); omit for solid cylinder

recovery:
  # Omit a parachute section entirely to disable that stage.
  # See documentation for which descent scenarios are active for each configuration.
  drogue:
    cd: 0.97
    diameter_mm: 914.0               # reference diameter (mm); area = pi*d^2/4
    threshold: apogee                # "apogee" or altitude in metres AGL
  main:
    cd: 2.2
    diameter_mm: 1829.0              # reference diameter (mm); area = pi*d^2/4
    threshold: 305                   # metres AGL
