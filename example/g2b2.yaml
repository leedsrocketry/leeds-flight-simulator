motor: "o3400.eng"             # RASP .eng thrust curve file (path relative to this file)
aero_tables: "aero_table.csv"  # path to a single RASAero II Aeroplot CSV, or a directory of CSVs;
                               # a single file runs without pitch/yaw damping or roll modelled (with warning)
# fins_aero_table: "aero_tables/fins.csv"  # uncomment to identify the fins component explicitly;
                                           # if omitted, the file whose name contains "fin" is used (case insensitive)

geometry:
  diameter: 0.130        # body diameter (m)
  length: 2.6            # total length (m)
  nozzle_position: 2.55  # nozzle exit plane from nosecone tip (m)
  nozzle_diameter: 0.08  # nozzle exit diameter (m)
  fin_cp_radius: 0.095   # fin CP spanwise distance from centreline (m)

mass:
  wet_mass: 26.5               # total mass at launch — airframe + loaded motor (kg)
  wet_cg: 1.15                 # wet vehicle CG from nosecone tip (m)
  wet_motor_cg: 1.82           # loaded motor CG from nosecone tip (m)
  propellant_inertia_roll:    1.4   # propellant roll inertia about roll axis (kg·m²)
  propellant_inertia_lateral: 1.3   # propellant lateral inertia about propellant CG (kg·m²)
  wet_inertia_lateral:  5.2    # wet vehicle lateral inertia about wet CG (kg·m²)
  wet_inertia_roll:     0.012  # wet vehicle roll inertia about roll axis (kg·m²)

recovery:
  # Omit a parachute section entirely to disable that stage.
  # See documentation for which descent scenarios are active for each configuration.
  drogue:
    cd: 0.97
    area: 0.15          # reference area (m²)
    threshold: apogee   # "apogee" or altitude in metres AGL
  main:
    cd: 2.2
    area: 2.8           # reference area (m²)
    threshold: 305      # metres AGL
