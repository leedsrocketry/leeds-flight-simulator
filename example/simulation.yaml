vehicle: "vehicle.yaml"   # path to vehicle.yaml (relative to this file)

site:
  latitude: 58.6104700
  longitude: -4.9434804
  ballistic_exclusion_radius: 500   # metres — ballistic landing must be outside this radius
                                    # from the launch site; used when inclination is "auto"
  launch_observation_radius: 200    # metres — radius of the automatic launch site
                                    # observation station added to every LOS check
  danger_area: "danger_area.geojson"
  altitude_ceiling: 16764           # metres (55,000 ft)
  # coastline: "coastline.geojson"  # uncomment to enable sea-landing check
  observation_stations:
    - name: "MOD Range Control"
      latitude: 58.40
      longitude: -4.76
      radius: 10000                 # metres
  map_markers:
    - name: "Durness"
      latitude: 58.40
      longitude: -4.76

launch:
  rail:
    azimuth: "auto"               # degrees clockwise from North, or "auto"
    azimuth_range: [-90, 90]      # [min, max] integer search range — required when azimuth is "auto"
    inclination: "auto"           # degrees from horizontal, or "auto"
    inclination_range: [85, 90]   # [min, max] integer search range — required when inclination is "auto"
    length: 4.0                   # metres
  wind_profiles: "wind_profiles.npz"
  surface_wind:                   # omit this section entirely to disable surface override
    speed_ms: 5.0                 # m/s
    bearing_deg: 270.0            # degrees clockwise from North
    blend_height_m: 300           # metres AGL

monte_carlo:
  samples: 1000
  seed: 42
  uncertainties:
    azimuth_sigma: 1.0            # degrees
    inclination_sigma: 0.5        # degrees
    fin_cant_sigma: 0.02          # degrees
    impulse_factor_sigma: 0.067   # fraction of total impulse
  acceptance:
    compliance_threshold: 0.997  # fraction of landings inside danger area
    buffer_distance: 1000        # metres inward from danger area boundary
    sm_transition_mach: 0.91     # Mach dividing subsonic / supersonic SM check
    sm_subsonic_min: 1.0         # calibres (M < sm_transition_mach)
    sm_supersonic_min: 2.0       # calibres (M >= sm_transition_mach)
    aoa_max: 12.0                # degrees
    sm_aoa_threshold: 5.0        # degrees: SM check applies when AoA < this
    # Descent scenarios: nominal, ballistic, drogue_only, premature_main (see §9)
    sea_check_scenarios:         # landing must not be at sea
      - nominal
      - ballistic
      - drogue_only
      - premature_main
    los_check_scenarios:         # landing must be visible from at least one station
      - ballistic
      - drogue_only
